spring.application.name=projekt-order-service
server.port=${PORT:7500}
# Databas
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Auth-server (Render)
app.auth-server-url=https://auth-service-latest-0c2f.onrender.com
# Product-service
app.product-service-url=${PRODUCT_SERVICE_URL:http://localhost:8080}
# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:qbasxmpc}
rabbitmq.queue.email=${RABBITMQ_EMAIL_QUEUE:email-queue}