spring.application.name=projekt-order-service
server.port=7500
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
product-service.base-url=${PRODUCT_SERVICE_BASE_URL:http://localhost:8080}
auth-server.base-url=${AUTH_SERVER_BASE_URL:http://localhost:9000}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
rabbitmq.queue.email=email-queue
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVER_BASE_URL}/auth/jwks
